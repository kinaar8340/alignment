[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alignment-scoring"
version = "0.1.0"
description = "Unit-circle alignment scoring engine, gate, dashboard, and Lorenz dynamics."
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
alignment = "alignment.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alignment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
